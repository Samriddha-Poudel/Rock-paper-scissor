<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rock Papper Scissor</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>


    <div class="container">
        <h1 class="app-title">Rock Paper Scissor</h1>
        <div class="weapon-box">
            <h3>Select Your Weapon</h3>
            <div class="weapons">
                <div class="rock"> 
                    <img src="Images/rock.png" alt="Rock">
                </div>
                <div class="paper">
                    <img src="Images/Paper.png" alt="Paper">
                </div>
                <div class="scissor">
                    <img src="Images/Scissors.png" alt="Scissors">
                </div>
            </div>
        </div>
        <div class="score-box">
            <div class="won">
                <h3>Won: <span>0</span></h3>
            </div>
            <div class="lost">
                <h3>Lost: <span>0</span></h3>
            </div>
            <div class="draw">
                <h3>Draw: <span>0</span></h3>
            </div>
        </div>
    </div>

    
</body>
</html>
