<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rock Papper Scissor</title>
      <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
        integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw=="
        crossorigin="anonymous" referrerpolicy="no-referrer" />
    <link rel="stylesheet" href="style.css">
</head>
<body>


    <div class="container">
        <h1 class="app-title">Rock Paper Scissor</h1>
        <div class="weapon-box">
            <h3>Select Your Weapon</h3>
            <div class="weapons">
                <div class="Rock"> 
                    <img src="Images/rock.png" alt="Rock">
                </div>
                <div class="Paper">
                    <img src="Images/Paper.png" alt="Paper">
                </div>
                <div class="Scissors">
                    <img src="Images/Scissors.png" alt="Scissors">
                </div>
            </div>
        </div>
        <div class="player-choices">
            <h3>Player <span>V/S</span> Computer </h3>
            <div class="player-choice">
                <img src="Images/rock.png">
            </div>
            <div class="computer-choice">
                <img src="Images/Rock.png">
            </div>
        </div>

        <div class="result-box">
            <h3>Congrats! You Won 🎉</h3>
            <button class="play-again">🔃 Play Again</button>
        </div>
        <div class="score-box">
            <div class="won">
                <h3>Won: <span>0</span></h3>
            </div>
            <div class="lost">
                <h3>Lost: <span>0</span></h3>
            </div>
            <div class="draw">
                <h3>Draw: <span>0</span></h3>
            </div>
        </div>
    </div>



    <footer>
        <p class="ftrTxt">Created by Samriddha Poudel</p>
        <a href="https://github.com/Samriddha-Poudel" class=github-link> 
            <i class="fa-brands fa-github"></i>

        </a>
    </footer>

    <script src="script.js"></script>
    
</body>
</html>
